[project]
name = "bjk-server"
version = "0.1.0"
description = "발주콕 API 서버"
requires-python = ">=3.12"
dependencies = [
    "bjk-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bjk_server"]
