[project]
name = "bjk-server"
version = "0.1.0"
description = "발주콕 API 서버"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=23.1",
    "bjk-contracts",
    "bjk-review",
    "fastapi>=0.115",
    "httpx>=0.28",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
    "weasyprint>=66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bjk_server"]
