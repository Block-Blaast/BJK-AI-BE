[project]
name = "bjk-server"
version = "0.1.0"
description = "발주콕 API 서버"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "bjk-contracts",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bjk_server"]
