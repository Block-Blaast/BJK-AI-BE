[project]
name = "bjk-review"
version = "0.1.0"
description = "발주 검토 판정 엔진(순수 함수). server가 같은 프로세스에서 실행한다"
requires-python = ">=3.12"
dependencies = ["bjk-contracts", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bjk_review"]
