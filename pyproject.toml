[project]
name = "bjk-ai-be"
version = "0.1.0"
description = "발주콕 server·ai 모노레포 루트"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
bjk-contracts = { workspace = true }
bjk-review = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/server/tests", "apps/ai/tests", "packages/review/tests"]
